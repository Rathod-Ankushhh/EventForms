
{% extends 'registrations/base.html' %}

{% block title %}Create Event | EventForms{% endblock %}

{% block content %}

<main class="auth-container">
    <section class="auth-card">

        <p class="eyebrow">Organizer Portal</p>

        <h1>Create New Event.</h1>

        <p class="auth-description">
            Add your event details and submit it for approval.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="submit-registration">
                Submit Event →
            </button>
        </form>

        <p class="auth-footer">
            <a href="{% url 'organizer_dashboard' %}">
                ← Back to Dashboard
            </a>
        </p>

    </section>
</main>

{% endblock %}
